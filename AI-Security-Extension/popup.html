<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Security Shield</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151d2f;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #243048;
      --primary: #3b82f6;
      --safe: #10b981;
      --suspicious: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
    }

    .toggle-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #374151;
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--primary);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .site-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .site-host {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      margin: 4px 0 10px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-safe {
      background: rgba(16, 185, 129, 0.15);
      color: var(--safe);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-suspicious {
      background: rgba(245, 158, 11, 0.15);
      color: var(--suspicious);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .badge-danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .badge-unknown {
      background: rgba(156, 163, 175, 0.15);
      color: var(--text-muted);
      border: 1px solid rgba(156, 163, 175, 0.3);
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .metric-value {
      font-weight: 600;
      color: var(--text-main);
    }

    .sources-list {
      margin-top: 10px;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .source-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .source-item.active {
      color: #93c5fd;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
      text-align: center;
    }

    .btn-secondary {
      background: #1e293b;
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #334155;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">
      <span>🛡️</span>
      <span>AI Security Shield</span>
    </div>
    <div class="toggle-wrapper">
      <span id="protectionStateText">ON</span>
      <label class="switch">
        <input type="checkbox" id="protectionToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card">
    <div class="site-label">Current Site</div>
    <div class="site-host" id="activeDomain">Checking...</div>

    <div class="status-row">
      <span class="status-badge badge-safe" id="statusBadge">Checking...</span>
    </div>

    <div class="metric-row">
      <span>Calculated Risk:</span>
      <span class="metric-value" id="riskScoreVal">--%</span>
    </div>

    <div class="metric-row">
      <span>Model Confidence:</span>
      <span class="metric-value" id="confidenceVal">--%</span>
    </div>

    <div class="sources-list" id="sourcesContainer">
      <div class="source-item" id="srcLocal">○ Local Heuristics</div>
      <div class="source-item" id="srcCommunity">○ Threat Database</div>
      <div class="source-item" id="srcAi">○ Gemini Deep AI</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-secondary" id="btnWhitelist">Allow Domain</button>
    <button class="btn btn-danger" id="btnReport">Report Threat</button>
  </div>

  <div class="card" style="margin-top: 12px;">
    <div class="site-label">📷 QR Code Threat Scanner</div>
    <div style="font-size: 11.5px; color: var(--text-muted); margin: 6px 0 10px 0;">
      In-page QR shields active. Inspect any QR code image:
    </div>
    <label class="btn btn-secondary" style="display: block; cursor: pointer; text-align: center; margin-bottom: 8px; font-size: 11px;">
      <span>Upload / Test QR Code</span>
      <input type="file" id="qrFileInput" accept="image/*" style="display: none;">
    </label>
    <div id="qrResultBox" style="display: none; background: #0b1120; border-radius: 8px; padding: 10px; border: 1px solid var(--border); font-size: 11px;">
      <div id="qrStatusBadge" class="status-badge badge-safe" style="margin-bottom: 6px;">SAFE</div>
      <div id="qrDecodedText" style="word-break: break-all; color: var(--text-main); font-family: monospace; margin-bottom: 4px;"></div>
      <div id="qrReasonsList" style="color: #f87171; line-height: 1.3;"></div>
    </div>
  </div>

  <div class="footer">
    Defense-in-depth phishing protection v2.0
  </div>

  <script src="utils/jsQR.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
