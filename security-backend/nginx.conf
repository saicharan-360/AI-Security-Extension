# ==============================================================================
# 🌐 NGINX REVERSE PROXY & LOAD BALANCER CONFIGURATION
# ==============================================================================
#
# 🛡️ HOW THIS NGINX CONFIGURATION PREVENTS SERVER CRASHES & TRAFFIC OVERLOAD:
#
# 1. ⚖️ Least-Connected Load Balancing (least_conn):
#    Instead of simple round-robin, requests are dynamically sent to whichever
#    Node.js container currently has the fewest active requests. This prevents
#    a single instance handling a slow database query from getting overwhelmed.
#
# 2. 🛡️ Rate Limiting & DDoS Spike Arrest (limit_req):
#    Allocates an in-memory 10MB IP tracking zone to throttle sudden traffic bursts
#    (up to 50 requests/sec with burst buffer of 30). This shields the Node.js
#    cluster from malicious bot floods without impacting legitimate extension users.
#
# 3. 🔄 Automatic Failover & Circuit Breaking (max_fails / fail_timeout):
#    If a Node.js instance becomes unresponsive or crashes (3 consecutive failures),
#    NGINX automatically pulls it out of the active pool for 10s and reroutes
#    traffic to healthy sibling instances with ZERO downtime for end users.
#
# 4. ⚡ HTTP/1.1 Upstream Keepalive Connection Pooling:
#    Maintains persistent TCP connections (32 idle sockets per worker) between
#    NGINX and the Node.js instances, eliminating SSL/TCP handshake latency.
#
# 5. 📦 Proxy Buffering (Asynchronous Response Handling):
#    NGINX buffers backend responses in memory, allowing Node.js event loops to
#    complete requests in microseconds rather than waiting for slow mobile clients.
# ==============================================================================

user  nginx;
worker_processes  auto; # Automatically scales across all available CPU cores

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 2048; # Handles up to 2,048 simultaneous connections per worker
    multi_accept on;         # Accepts all new incoming connections simultaneously
    use epoll;               # Linux high-performance I/O multiplexing event system
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log Formatting
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # Performance Optimizations
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression (Reduces payload transfer sizes by ~70%)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ==========================================================================
    # 🛑 RATE LIMITING ZONES
    # ==========================================================================
    # Tracks client IP addresses in a 10MB shared memory zone (~160,000 IPs).
    # Allows a baseline of 50 requests per second per IP.
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=50r/s;
    limit_req_status 429; # Returns HTTP 429 (Too Many Requests) when rate exceeded

    # ==========================================================================
    # ⚖️ UPSTREAM LOAD BALANCING CLUSTER
    # ==========================================================================
    upstream security_backend_cluster {
        # 'least_conn' algorithm: Directs new requests to the server with fewest active connections
        least_conn;

        # Node.js backend container replicas
        server backend-node-1:5000 max_fails=3 fail_timeout=10s;
        server backend-node-2:5000 max_fails=3 fail_timeout=10s;
        server backend-node-3:5000 max_fails=3 fail_timeout=10s;

        # Persistent connection pool to backend containers
        keepalive 32;
    }

    # ==========================================================================
    # 🌐 SERVER BLOCK / REVERSE PROXY
    # ==========================================================================
    server {
        listen 80;
        server_name localhost;

        # Maximum allowed request body size (prevents memory exhaustion from large payloads)
        client_max_body_size 5M;

        # Proxy Timeouts (Ensures stalled queries are cancelled cleanly)
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        # Proxy Buffering Configuration
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;

        # ----------------------------------------------------------------------
        # API Endpoints Routing & Load Balancing
        # ----------------------------------------------------------------------
        location / {
            # Apply Rate Limiting (Burst allows sudden micro-spikes up to 30 requests without delay)
            limit_req zone=api_rate_limit burst=30 nodelay;

            # Forward traffic to the load-balanced upstream cluster
            proxy_pass http://security_backend_cluster;

            # HTTP/1.1 Configuration for keepalive sockets
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Standard Forwarding Headers (Preserves client identity for threat analytics)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Automatic Next Upstream Retry (If a node fails midway, retry on another healthy node)
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        # ----------------------------------------------------------------------
        # Fast Healthcheck Endpoint for Load Balancer / Monitoring
        # ----------------------------------------------------------------------
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
