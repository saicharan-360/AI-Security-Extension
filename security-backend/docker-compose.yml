# ==============================================================================
# 🐳 DOCKER COMPOSE - MULTI-CONTAINER CLUSTER WITH NGINX LOAD BALANCER
# ==============================================================================
#
# Launches:
# 1. 3x Replicas of the Node.js Express Backend
# 2. 1x NGINX Load Balancer distributing traffic across all 3 nodes
#
# To run:
#   docker compose up --build -d
# To scale to 5 backend nodes:
#   docker compose up -d --scale backend-node-1=5
# ==============================================================================

version: '3.8'

services:
  # Node.js Instance 1
  backend-node-1:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - security-net

  # Node.js Instance 2
  backend-node-2:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - security-net

  # Node.js Instance 3
  backend-node-3:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - security-net

  # NGINX Load Balancer & Reverse Proxy
  load-balancer:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-node-1
      - backend-node-2
      - backend-node-3
    networks:
      - security-net

networks:
  security-net:
    driver: bridge
